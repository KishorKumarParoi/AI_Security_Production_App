name: Enterprise CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linting & Security Tools
        run: |
          pip install --upgrade pip
          pip install ruff pytest bandit
      - name: Code Quality (Ruff)
        run: |
          ruff check app/ evals/ ui/ || true
      - name: Security Scan (Bandit AST check)
        run: |
          bandit -r app/ -ll --exclude .venv || true
      - name: Run Unit Tests
        run: |
          pytest tests/ -v
